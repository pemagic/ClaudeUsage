<svg xmlns="http://www.w3.org/2000/svg" width="320" height="520" viewBox="0 0 320 520">
  <defs>
    <filter id="shadow" x="-5%" y="-2%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="barBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8743320"/>
      <stop offset="100%" stop-color="#b8743320"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b87433"/>
      <stop offset="100%" stop-color="#c98844"/>
    </linearGradient>
  </defs>

  <!-- Menu bar strip -->
  <rect x="0" y="0" width="320" height="28" rx="0" fill="#2d2d2d"/>
  <!-- Cat icon in menu bar -->
  <g transform="translate(230,5)">
    <!-- Left ear -->
    <polygon points="2,6 1,0.5 6,4" fill="#e0e0e0"/>
    <!-- Right ear -->
    <polygon points="14,6 15,0.5 10,4" fill="#e0e0e0"/>
    <!-- Head -->
    <ellipse cx="8" cy="11" rx="7" ry="7" fill="#e0e0e0"/>
  </g>
  <text x="250" y="18" font-family="-apple-system,SF Pro Text,Helvetica" font-size="12" fill="#e0e0e0" font-variant-numeric="tabular-nums">72%</text>

  <!-- Popup panel -->
  <rect x="10" y="36" width="300" height="476" rx="10" fill="#1e1e1e" filter="url(#shadow)"/>
  <!-- Border -->
  <rect x="10" y="36" width="300" height="476" rx="10" fill="none" stroke="#3a3a3a" stroke-width="0.5"/>

  <!-- Header -->
  <text x="26" y="66" font-family="-apple-system,SF Pro Text,Helvetica" font-size="17" font-weight="bold" fill="#f0f0f0">Claude</text>
  <text x="26" y="82" font-family="-apple-system,SF Pro Text,Helvetica" font-size="12" fill="#888">Updated 2m ago</text>
  <!-- Max badge -->
  <rect x="253" y="52" width="40" height="22" rx="5" fill="#b8743330"/>
  <text x="273" y="67" font-family="-apple-system,SF Pro Text,Helvetica" font-size="11" font-weight="600" fill="#c98844" text-anchor="middle">Max</text>

  <!-- Divider 1 -->
  <line x1="10" y1="94" x2="310" y2="94" stroke="#3a3a3a" stroke-width="0.5"/>

  <!-- Session Section -->
  <text x="26" y="118" font-family="-apple-system,SF Pro Text,Helvetica" font-size="16" font-weight="bold" fill="#f0f0f0">Session</text>
  <!-- Progress bar bg -->
  <rect x="26" y="126" width="268" height="10" rx="5" fill="#b8743325"/>
  <!-- Progress bar fill (28% used = 72% remaining) -->
  <rect x="26" y="126" width="193" height="10" rx="5" fill="#b87433"/>
  <!-- Stats -->
  <text x="26" y="152" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#888">72% left</text>
  <text x="294" y="152" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#888" text-anchor="end">Resets in 3h 42m</text>

  <!-- Divider 2 -->
  <line x1="10" y1="166" x2="310" y2="166" stroke="#3a3a3a" stroke-width="0.5"/>

  <!-- Weekly Section -->
  <text x="26" y="190" font-family="-apple-system,SF Pro Text,Helvetica" font-size="16" font-weight="bold" fill="#f0f0f0">Weekly</text>
  <!-- Progress bar bg -->
  <rect x="26" y="198" width="268" height="10" rx="5" fill="#b8743325"/>
  <!-- Progress bar fill (45% used = 55% remaining) -->
  <rect x="26" y="198" width="147" height="10" rx="5" fill="#b87433"/>
  <!-- Stats -->
  <text x="26" y="224" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#888">55% left</text>
  <text x="294" y="224" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#888" text-anchor="end">Resets in 4d 12h</text>
  <!-- Pace -->
  <text x="26" y="242" font-family="-apple-system,SF Pro Text,Helvetica" font-size="12" fill="#666">Pace: Ahead (+12%) · Runs out in 2d 5h</text>

  <!-- Divider 3 -->
  <line x1="10" y1="256" x2="310" y2="256" stroke="#3a3a3a" stroke-width="0.5"/>

  <!-- Sonnet Section -->
  <text x="26" y="280" font-family="-apple-system,SF Pro Text,Helvetica" font-size="16" font-weight="bold" fill="#f0f0f0">Sonnet</text>
  <!-- Progress bar bg -->
  <rect x="26" y="288" width="268" height="10" rx="5" fill="#b8743325"/>
  <!-- Progress bar fill (22% used = 78% remaining) -->
  <rect x="26" y="288" width="209" height="10" rx="5" fill="#b87433"/>
  <!-- Stats -->
  <text x="26" y="314" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#888">78% left</text>
  <text x="294" y="314" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#888" text-anchor="end">Resets in 4d 12h</text>

  <!-- Divider 4 -->
  <line x1="10" y1="328" x2="310" y2="328" stroke="#3a3a3a" stroke-width="0.5"/>

  <!-- Cost Section -->
  <text x="26" y="352" font-family="-apple-system,SF Pro Text,Helvetica" font-size="16" font-weight="bold" fill="#f0f0f0">Cost</text>
  <!-- Today -->
  <text x="26" y="374" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#888">Today: </text>
  <text x="68" y="374" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#f0f0f0">$39.74</text>
  <text x="114" y="374" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#888"> · 128.5M tokens</text>
  <!-- 30 days -->
  <text x="26" y="394" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#888">Last 30 days: </text>
  <text x="112" y="394" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#f0f0f0">$463.20</text>
  <text x="166" y="394" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#888"> · 1.2B tokens</text>

  <!-- Divider 5 -->
  <line x1="10" y1="414" x2="310" y2="414" stroke="#3a3a3a" stroke-width="0.5"/>

  <!-- Footer buttons -->
  <!-- Refresh -->
  <text x="50" y="438" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#f0f0f0">Refresh Now</text>
  <text x="30" y="438" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#888">↻</text>

  <line x1="10" y1="450" x2="310" y2="450" stroke="#3a3a3a" stroke-width="0.5"/>
  <!-- Settings -->
  <text x="50" y="474" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#f0f0f0">Settings...</text>
  <text x="30" y="474" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#888">⚙</text>

  <line x1="10" y1="486" x2="310" y2="486" stroke="#3a3a3a" stroke-width="0.5"/>
  <!-- Quit -->
  <text x="50" y="506" font-family="-apple-system,SF Pro Text,Helvetica" font-size="13" fill="#f0f0f0">Quit ClaudeUsage</text>
</svg>
